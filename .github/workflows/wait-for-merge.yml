name: Wait-For-Merge

# Completes /wait-for-merge waits across the organization: finds open pull requests with the configured
# waitForMerge label and removes it, with a ready-to-merge comment, once every linked pull request is merged or
# closed. The schedule is a backstop. For a near-instant reaction, have something that watches the
# organization (for example an organization webhook) send a repository_dispatch of type
# "pull-request-closed" to this repository whenever a pull request closes. The payload is only logged; every
# pull request is read again from the API. Needs the configured PAT or GitHub App token.

on:
  repository_dispatch:
    types:
      - pull-request-closed
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wait-for-merge
  cancel-in-progress: false

jobs:
  wait-for-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Load properties
        id: properties
        run: node scripts/export-properties.mjs

      - name: Resolve PAT auth token
        id: pat_auth
        if: ${{ steps.properties.outputs.auth_mode == 'pat' }}
        env:
          AUTH_MODE: pat
          PAT_TOKEN: ${{ secrets[steps.properties.outputs.pat_token_secret_name] }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/create-github-auth-token.mjs

      - name: Resolve GitHub App auth token
        id: app_auth
        if: ${{ steps.properties.outputs.auth_mode == 'githubApp' }}
        env:
          AUTH_MODE: githubApp
          GITHUB_APP_ID: ${{ secrets[steps.properties.outputs.github_app_id_secret_name] }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets[steps.properties.outputs.github_app_private_key_secret_name] }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets[steps.properties.outputs.github_app_installation_id_secret_name] }}
        run: node scripts/create-github-auth-token.mjs

      - name: Complete finished waits
        env:
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.repository }}
          DISPATCH_PULL_REQUEST: ${{ github.event.client_payload.number }}
        run: node scripts/wait-for-merge.mjs
