name: Label Test Command Dispatch

# Runs "/" commands such as /wait-for-merge and /team (see config/commands.jsonc). This is the only way commands
# arrive: something that watches the organization (for example a GitHub App's webhook handler) sends one
# repository_dispatch to this repository for each comment that is created, edited or deleted, with type
# "pull-request-comment" for pull request comments and "issue-comment" for issue comments:
#
#   POST /repos/<this repository>/dispatches
#   {"event_type": "pull-request-comment",
#    "client_payload": {"repository": "owner/name", "number": 123, "comment_id": 456, "action": "created",
#                       "sender": "login"}}
#
# "sender" (who created, edited or deleted the comment) is optional. With it, edits Label Sync made itself, such
# as the status icons /wait-for-merge writes into command comments, are skipped without doing anything. Better
# still, whatever sends the dispatch can drop those events itself.
#
# The payload only says where to look. The script checks that the repository is in the organization and reads
# the comment again from the API, ignoring comments that are on another issue or pull request, written by a
# bot, or do not start with "/". Both types are handled the same way, because the type is not trusted either. The values are passed through env, never into a shell command, and no pull request code
# is checked out. Needs the configured GitHub App token, because it acts on other repositories.

on:
  repository_dispatch:
    types:
      - pull-request-comment
      - issue-comment

permissions:
  contents: read

jobs:
  label-test-command:
    runs-on: ubuntu-latest
    concurrency:
      group: label-test-command-${{ github.event.client_payload.repository }}-${{ github.event.client_payload.number }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Load properties
        id: properties
        run: node scripts/export-properties.mjs

      # No GITHUB_TOKEN fallback: this repository's token cannot act on the target repository. Commands only
      # work with GitHub App authentication.
      - name: Require GitHub App auth
        if: ${{ steps.properties.outputs.auth_mode != 'githubApp' }}
        run: |
          echo "::error title=GitHub App required::Commands only work with GitHub App authentication (\"authentication.mode\": \"githubApp\" in config/properties.jsonc)."
          exit 1

      - name: Resolve GitHub App auth token
        id: app_auth
        if: ${{ steps.properties.outputs.auth_mode == 'githubApp' }}
        env:
          AUTH_MODE: githubApp
          GITHUB_APP_ID: ${{ secrets[steps.properties.outputs.github_app_id_secret_name] }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets[steps.properties.outputs.github_app_private_key_secret_name] }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets[steps.properties.outputs.github_app_installation_id_secret_name] }}
        run: node scripts/create-github-auth-token.mjs

      - name: Run command
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.client_payload.number }}
          COMMENT_ID: ${{ github.event.client_payload.comment_id }}
          COMMENT_ACTION: ${{ github.event.client_payload.action }}
          COMMENT_SENDER: ${{ github.event.client_payload.sender }}
        run: node scripts/run-label-test-command.mjs
