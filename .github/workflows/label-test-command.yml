name: Label Test Command

on:
  workflow_call:
    inputs:
      label_sync_repository:
        description: "Repository that contains the central Label Test workflow config and scripts."
        required: true
        type: string
      label_sync_ref:
        description: "Ref to check out from the central Label Sync repository."
        required: true
        type: string

# Runs slash commands such as /wait-for-merge from pull request comments. The target repository, pull request
# and comment come from the caller's issue_comment context. The comment body is read again from the API by the
# script and is never placed in a shell command. No pull request code is checked out.
#
# The configured PAT or GitHub App token is preferred: label changes made with it start Label Test by
# themselves. With the GITHUB_TOKEN fallback, issues and pull-requests write cover the comment and the label,
# and actions: write lets the script rerun Label Test so the required check sees the label change.
permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-test-command:
    runs-on: ubuntu-latest
    concurrency:
      group: label-test-command-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Check out Label Sync repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.label_sync_repository }}
          ref: ${{ inputs.label_sync_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Load properties
        id: properties
        env:
          GITHUB_REPOSITORY: ${{ inputs.label_sync_repository }}
        run: node scripts/export-properties.mjs

      - name: Resolve PAT auth token
        id: pat_auth
        if: ${{ steps.properties.outputs.auth_mode == 'pat' }}
        env:
          AUTH_MODE: pat
          PAT_TOKEN: ${{ secrets[steps.properties.outputs.pat_token_secret_name] }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/create-github-auth-token.mjs

      - name: Resolve GitHub App auth token
        id: app_auth
        if: ${{ steps.properties.outputs.auth_mode == 'githubApp' }}
        env:
          AUTH_MODE: githubApp
          GITHUB_APP_ID: ${{ secrets[steps.properties.outputs.github_app_id_secret_name] }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets[steps.properties.outputs.github_app_private_key_secret_name] }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets[steps.properties.outputs.github_app_installation_id_secret_name] }}
        run: node scripts/create-github-auth-token.mjs

      - name: Run pull request command
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-label-test-command.mjs
